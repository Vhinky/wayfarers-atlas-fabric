plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file('src/main/resources/wayfarers_atlas.accesswidener')
}

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/' } // Mod Menu (optional: the "Config" button in the mods list)
    // Maven Central (repo.maven.apache.org) may not open on some computers (its certificate is not accepted):
    // its official mirror on Google is used instead - also for the Maven Central that Loom adds by itself
    all { repo ->
        if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org')) {
            repo.url = 'https://maven-central.storage-download.googleapis.com/maven2/'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// the jar is called like wayfarers_atlas-1.3.0-fabric-1.21.1.jar
remapJar {
    archiveFileName = "${project.mod_id}-${project.mod_version}-fabric-${project.minecraft_version}.jar"
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
